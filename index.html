<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulse OS</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="boot">
    <div class="logo">PULSE</div>
    <div class="bar"></div>
    <p>Starting Pulse OS...</p>
</div>

<div id="desktop">

    <div class="background"></div>

    <div id="windows"></div>

    <div id="startMenu">

        <h2>Pulse OS</h2>

        <input
            id="appSearch"
            placeholder="Search apps..."
        >

        <div class="apps">

            <button onclick="openBrowser()">
                🌐
                <span>Browser</span>
            </button>

            <button onclick="openFiles()">
                📁
                <span>Files</span>
            </button>

            <button onclick="openStore()">
                🛍️
                <span>Store</span>
            </button>

            <button onclick="openSettings()">
                ⚙️
                <span>Settings</span>
            </button>

            <button onclick="openAbout()">
                💻
                <span>About</span>
            </button>

        </div>

    </div>

    <div id="taskbar">

        <button
            id="start"
            onclick="toggleStart()">
            ◉
        </button>

        <div id="tasks"></div>

        <div id="clock"></div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
